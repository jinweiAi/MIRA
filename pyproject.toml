[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-visual-reading"
version = "0.1.0"
description = "Latent-conditioned spatial selection and per-position layer reading for Qwen2.5-VL"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.51.3",
  "peft==0.15.2",
  "accelerate==1.6.0",
  "numpy>=1.24,<3",
  "Pillow>=10",
  "safetensors>=0.4",
]
[project.optional-dependencies]
test = ["pytest>=8"]
eval = ["pandas>=2", "openpyxl>=3", "datasets>=3"]
[project.scripts]
mira-train = "mira.training:main"
mira-infer = "mira.inference:main"
mira-evaluate = "mira.evaluation:main"
mira-prepare-data = "mira.data:main"

[tool.setuptools.packages.find]
include = ["mira*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
